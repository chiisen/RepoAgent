<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoAgent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { font-size: 16px; }
    body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: #111; color: #eee; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: #1c1c1c; }
    input, select, button { font-size: 14px; padding: 6px 10px; }
    #rootDir { min-width: 28rem; flex: 1; }
    #repoCount { font-size: 14px; color: #ccc; white-space: nowrap; }
    #toast { position: fixed; right: 16px; bottom: 16px; background: #333; padding: 10px 14px; border-radius: 8px; display: none; max-width: 420px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 16px; }
    .card { background: #1c1c1c; border-radius: 10px; padding: 12px; border: 1px solid #333; }
    .title { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
    .lamp-clean { color: #3ddc84; }
    .lamp-dirty { color: #f5c542; }
    .lamp-fail { color: #ff6b6b; }
    .meta { font-size: 14px; line-height: 1.5; color: #ccc; margin: 8px 0; }
    .actions { display: flex; gap: 8px; }
    #drawer { position: fixed; top: 0; right: 0; width: min(420px, 100%); height: 100%; background: #181818; transform: translateX(100%); transition: transform .2s; overflow: auto; padding: 16px; box-sizing: border-box; }
    #drawer.open { transform: none; }
    pre { white-space: pre-wrap; font-size: 13px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .spin { display: inline-block; width: 0.85em; height: 0.85em; margin-right: 6px; border: 2px solid #555; border-top-color: #3ddc84; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #scanMask { display: none; position: fixed; inset: 0; top: 56px; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 5; }
    #scanMask.show { display: flex; }
    #scanMask span { font-size: 16px; background: #1c1c1c; padding: 14px 20px; border-radius: 10px; border: 1px solid #333; }
  </style>
</head>
<body>
  <header>
    <strong>RepoAgent</strong>
    <input id="rootDir" type="text" placeholder="貼上要掃的目錄，例如 D:\github\chiisen" spellcheck="false">
    <button id="btnScan">掃描</button>
    <span id="repoCount">0 個專案</span>
    <input id="q" placeholder="搜尋名稱">
    <select id="filter">
      <option value="all">全部</option>
      <option value="clean">乾淨</option>
      <option value="dirty">有變更</option>
    </select>
    <select id="sort">
      <option value="name">名稱</option>
      <option value="lastCommitTime">最後 commit</option>
    </select>
  </header>
  <div class="grid" id="grid"></div>
  <div id="scanMask" aria-live="polite"><span><i class="spin"></i><span id="scanLabel">掃描中…</span></span></div>
  <aside id="drawer"></aside>
  <div id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 4000); };
    const lamp = (r) => r.lastError ? ['lamp-fail', '失敗'] : r.isDirty ? ['lamp-dirty', '有變更'] : ['lamp-clean', '乾淨'];
    async function api(path, opt) {
      const res = await fetch(path, opt);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || body.message || res.statusText);
      return body;
    }
    const SCAN_FETCH_MS = 90_000;
    const PULL_FETCH_MS = 30_000;
    async function loadConfig() {
      const c = await api('/api/config');
      if (c.rootDir && !$('rootDir').value) $('rootDir').value = normalizeRootDirInput(c.rootDir);
      else applyRootDirNorm();
      return c;
    }
    async function loadRepos() {
      const q = $('q').value, filter = $('filter').value, sort = $('sort').value;
      const data = await api('/api/repos?q=' + encodeURIComponent(q) + '&filter=' + filter + '&sort=' + sort);
      $('repoCount').textContent = (data.total ?? data.repos.length) + ' 個專案';
      $('grid').innerHTML = data.repos.map((r) => {
        const [cls, label] = lamp(r);
        const msg = (r.lastCommitMsg || '').slice(0, 72);
        const t = r.lastCommitTime ? r.lastCommitTime.slice(0, 16).replace('T', ' ') : '';
        const pullAt = r.lastPullAt ? r.lastPullAt.slice(0, 16).replace('T', ' ') : '';
        const pullMsg = (r.lastPullMsg || '').slice(0, 80);
        return `<article class="card" data-id="${r.id}">
          <div class="title"><span>${r.name}</span><span class="${cls}">${label}</span></div>
          <div class="meta">分支 ${r.branch || '—'}<br>
            狀態 ${r.isDirty ? '變更 ' + r.dirtyCount : '乾淨'}<br>
            最後 commit ${t} ${msg}<br>
            上次掃描 ${r.lastScannedAt || '—'}<br>
            最後更新 ${pullAt || '—'} ${pullMsg || ''}</div>
          <div class="actions">
            <button data-act="detail">詳情</button>
            <button data-act="pull">更新</button>
            <button data-act="opt">用 pi 優化</button>
          </div>
        </article>`;
      }).join('') || '<p style="padding:16px">尚無專案，請先掃描。</p>';
    }
    let scanning = false;
    function scanCaption(p) {
      if (!p) return '掃描中…';
      const n = typeof p.done === 'number' ? p.done : 0;
      const t = typeof p.total === 'number' ? p.total : 0;
      if (!t && p.current) return p.current;
      const cur = p.current ? ' · ' + p.current : '';
      return '掃描中 ' + n + ' / ' + t + cur;
    }
    function setScanning(on, label) {
      scanning = on;
      $('btnScan').disabled = on;
      $('rootDir').disabled = on;
      $('btnScan').innerHTML = on ? '<i class="spin"></i>掃描中' : '掃描';
      $('scanLabel').textContent = label || (on ? '掃描中…' : '掃描');
      $('scanMask').classList.toggle('show', on);
    }
    function normalizeRootDirInput(s) {
      const t = s.trim();
      if (/^[a-zA-Z]:[\\/]$/.test(t)) return t[0] + ':\\';
      return t.replace(/[\\/]+$/, '');
    }
    function applyRootDirNorm() {
      const n = normalizeRootDirInput($('rootDir').value);
      if (n !== $('rootDir').value) $('rootDir').value = n;
    }
    async function scanNow() {
      if (scanning) return;
      const rootDir = normalizeRootDirInput($('rootDir').value);
      $('rootDir').value = rootDir;
      if (!rootDir) throw new Error('請先貼上要掃的目錄');
      $('grid').innerHTML = '';
      $('repoCount').textContent = '0 個專案';
      setScanning(true, '掃描中…');
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), SCAN_FETCH_MS);
      const poll = setInterval(async () => {
        try {
          const p = await api('/api/scan/progress');
          setScanning(true, scanCaption(p));
        } catch { /* 舊伺服器沒有 progress 端點時略過 */ }
      }, 250);
      try {
        await api('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rootDir }), signal: ac.signal });
        const s = await api('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rootDir }), signal: ac.signal });
        toast('掃描完成：' + s.okCount + ' 成功 / ' + s.failCount + ' 失敗');
        await loadRepos();
      } catch (e) {
        if (e && (e.name === 'AbortError' || String(e).includes('abort'))) {
          throw new Error('掃描逾時，請改掃較小的目錄（只掃下一層 git 專案）');
        }
        throw e;
      } finally {
        clearInterval(poll);
        clearTimeout(timer);
        setScanning(false);
      }
    }
    $('btnScan').onclick = () => scanNow().catch((e) => toast(String(e.message || e)));
    $('rootDir').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); scanNow().catch((e) => toast(String(e.message || e))); }
    });
    $('rootDir').addEventListener('blur', applyRootDirNorm);
    $('rootDir').addEventListener('paste', () => setTimeout(applyRootDirNorm, 0));
    $('rootDir').addEventListener('change', applyRootDirNorm);
    $('rootDir').addEventListener('input', () => {
      $('grid').innerHTML = '';
      $('repoCount').textContent = '0 個專案';
    });
    ['q', 'filter', 'sort'].forEach((id) => $(id).onchange = () => loadRepos().catch((e) => toast(e.message)));
    $('q').oninput = () => loadRepos().catch((e) => toast(e.message));
    $('grid').onclick = async (ev) => {
      const btn = ev.target.closest('button');
      const card = ev.target.closest('.card');
      if (!btn || !card) return;
      const id = card.dataset.id;
      try {
        if (btn.dataset.act === 'detail') {
          const d = await api('/api/repos/' + id);
          $('drawer').classList.add('open');
          $('drawer').innerHTML = '<button id="closeD">關閉</button><h2>' + d.repo.name + '</h2><h3>status</h3><pre>' +
            (d.statusShort.join('\n') || '(乾淨)') + '</pre><h3>log -5</h3><pre>' +
            d.recentCommits.map((c) => c.hash.slice(0, 7) + ' ' + c.date + ' ' + c.message).join('\n') + '</pre>';
          $('closeD').onclick = () => $('drawer').classList.remove('open');
        } else if (btn.dataset.act === 'pull') {
          btn.disabled = true;
          btn.textContent = '更新中';
          const ac = new AbortController();
          const timer = setTimeout(() => ac.abort(), PULL_FETCH_MS);
          try {
            const r = await api('/api/repos/' + id + '/pull', { method: 'POST', signal: ac.signal });
            toast((r.message || '已更新').slice(0, 200));
          } catch (e) {
            await loadRepos().catch(() => {});
            if (e && (e.name === 'AbortError' || String(e).includes('abort'))) {
              throw new Error('更新逾時，遠端可能在等 Git 憑證');
            }
            throw e;
          } finally {
            await loadRepos().catch(() => {});
            clearTimeout(timer);
            btn.disabled = false;
            btn.textContent = '更新';
          }
        } else {
          const r = await api('/api/repos/' + id + '/optimize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          toast('已排程 job ' + r.job.id);
        }
      } catch (e) { toast(String(e.message || e)); }
    };
    loadConfig().then(loadRepos).catch((e) => toast(e.message));
  </script>
</body>
</html>
